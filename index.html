<body class="bg-slate-50 text-slate-800 antialiased">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useMemo, useRef } from 'react';
    import ReactDOM from 'react-dom/client';

    import { initializeApp, getApps } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';
    import {
      getAuth,
      onAuthStateChanged,
      signInAnonymously,
      signInWithCustomToken
    } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';
    import {
      getFirestore,
      doc,
      setDoc,
      onSnapshot,
      collection,
      deleteDoc,
      writeBatch
    } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';

    import * as Lucide from 'https://esm.sh/lucide-react@0.344.0';

    const {
      PlusCircle, BarChart3, Calendar, LogOut, Database, MessageCircle, Clock, Home, Share2,
      CalendarCheck, UserPlus, CheckCircle2, Download, Search, CalendarDays, Trophy, Medal,
      Crown, Star, Award, User, Lock, RefreshCw, AlertTriangle, ChevronRight, Filter, Check,
      ChevronDown, X, FileSpreadsheet, UploadCloud, HelpCircle, Zap, PhoneCall
    } = Lucide;

    // ── CONFIGURACIÓN FIREBASE ──────────────────────────────────────────────
    const firebaseConfig = {
      apiKey: "AIzaSyBWNlMbW8mygVNeEz2vRMC5Bbr0VP79GFo",
      authDomain: "bt120-kw-santa-ana.firebaseapp.com",
      projectId: "bt120-kw-santa-ana",
      storageBucket: "bt120-kw-santa-ana.firebasestorage.app",
      messagingSenderId: "362058547139",
      appId: "1:362058547139:web:6401df259ddfac0d948776"
    };

    const app = getApps().length === 0 ? initializeApp(firebaseConfig) : getApps()[0];
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = 'bt120-kw-santa-ana';

    // ── NÓMINA BASE ────────────────────────────────────────────────────────
    const PRELOADED_AGENTS = [
      { id: 'leopoldo_lascarro', nombre: 'Leopoldo Lascarro O.', email: 'teckwsantaana@kwcolombia.com', pin: '9700', telefono: '+573107596589', isAdmin: true },
      { id: 'andres_gomez', nombre: 'Andrés Felipe Gómez', email: 'andres.gomez@kwcolombia.com', pin: '1234', telefono: '+573001234567', isAdmin: false },
      { id: 'camila_restrepo', nombre: 'Camila Restrepo Patiño', email: 'camila.restrepo@kwcolombia.com', pin: '5678', telefono: '+573007654321', isAdmin: false }
    ];

    const INDICATORS = [
      { id: 'nuevosBD', label: 'Nuevos a Base de Datos', color: 'bg-rose-50 border-rose-200 text-rose-700', icon: Database, weight: 2 },
      { id: 'conversaciones', label: 'Conversación Inmobiliaria', color: 'bg-emerald-50 border-emerald-200 text-emerald-700', icon: MessageCircle, weight: 2 },
      { id: 'seguimiento', label: 'Seguimiento', color: 'bg-sky-50 border-sky-200 text-sky-700', icon: Clock, weight: 2 },
      { id: 'openHouse', label: 'Prospecto de Open House', color: 'bg-amber-50 border-amber-200 text-amber-700', icon: Home, weight: 2 },
      { id: 'redesSociales', label: 'Prospecto de Redes Sociales', color: 'bg-indigo-50 border-indigo-200 text-indigo-700', icon: Share2, weight: 2 },
      { id: 'citas', label: 'Citas Programadas', color: 'bg-purple-50 border-purple-200 text-purple-700', icon: CalendarCheck, weight: 25 },
      { id: 'referencias', label: 'Referencias Recibidas', color: 'bg-teal-50 border-teal-200 text-teal-700', icon: UserPlus, weight: 50 },
      { id: 'captaciones', label: 'Captaciones', color: 'bg-orange-50 border-orange-200 text-orange-700', icon: Star, weight: 75 },
      { id: 'cierres', label: 'Cierres', color: 'bg-green-50 border-green-200 text-green-700', icon: Trophy, weight: 100 },
    ];

    const RANKING_METRICS_DEF = {
      puntos: { label: 'Puntaje Total', unit: 'Pts' },
      nuevosBD: { label: 'Nuevos BD', unit: 'Contactos' },
      conversaciones: { label: 'Conversación Inmobiliaria', unit: 'Conversaciones' },
      seguimiento: { label: 'Seguimiento', unit: 'Seguimientos' },
      openHouse: { label: 'Prospecto Open House', unit: 'Prospectos' },
      redesSociales: { label: 'Prospecto Redes', unit: 'Prospectos' },
      citas: { label: 'Citas Programadas', unit: 'Citas' },
      referencias: { label: 'Referencias Recibidas', unit: 'Referencias' },
      captaciones: { label: 'Captaciones', unit: 'Captaciones' },
      cierres: { label: 'Cierres', unit: 'Cierres' }
    };

    // ── HELPERS ────────────────────────────────────────────────────────────
    const calcScore = (log) =>
      (log.nuevosBD || 0) * 2 +
      (log.conversaciones || 0) * 2 +
      (log.seguimiento || 0) * 2 +
      (log.openHouse || 0) * 2 +
      (log.redesSociales || 0) * 2 +
      (log.citas || 0) * 25 +
      (log.referencias || 0) * 50 +
      (log.captaciones || 0) * 75 +
      (log.cierres || 0) * 100;

    const emptyForm = () => ({
      nuevosBD: 0, conversaciones: 0, seguimiento: 0,
      openHouse: 0, redesSociales: 0, citas: 0, referencias: 0,
      captaciones: 0, cierres: 0
    });

    // ── COMPONENTE PRINCIPAL ───────────────────────────────────────────────
    function App() {
      const [firebaseUser, setFirebaseUser]   = useState(null);
      const [fbReady, setFbReady]             = useState(false);
      const [currentAgent, setCurrentAgent]   = useState(null);
      const [loading, setLoading]             = useState(true);
      const [authError, setAuthError]         = useState('');

      const [agentSearchInput, setAgentSearchInput]   = useState('');
      const [isDropdownOpen, setIsDropdownOpen]       = useState(false);
      const [selectedAgentTemp, setSelectedAgentTemp] = useState(null);
      const [pinInput, setPinInput]                   = useState('');
      const [showPin, setShowPin]                     = useState(false);
      const dropdownRef = useRef(null);

      const [activeTab, setActiveTab]               = useState('daily');
      const [activeRankingMetric, setActiveRankingMetric] = useState('puntos');

      const [allLogs, setAllLogs]             = useState([]);
      const [powerHourLogs, setPowerHourLogs] = useState([]);
      const [firestoreAgents, setFirestoreAgents] = useState([]);

      const [csvPreviewData, setCsvPreviewData] = useState([]);
      const [isUploadingCsv, setIsUploadingCsv] = useState(false);
      const [csvError, setCsvError]             = useState('');
      const fileInputRef = useRef(null);

      const [selectedDate, setSelectedDate] = useState(new Date().toISOString().split('T')[0]);
      const [dailyForm, setDailyForm]       = useState(emptyForm());

      const [savingLog, setSavingLog]       = useState(false);
      const [actionNotice, setActionNotice] = useState({ show: false, message: '', type: 'success' });
      const [generatingMock, setGeneratingMock] = useState(false);
      const [confirmModal, setConfirmModal] = useState({ show: false, title: '', message: '', onConfirm: null });

      const [adminSearchTerm, setAdminSearchTerm]     = useState('');
      const [adminSelectedUser, setAdminSelectedUser] = useState('all');

      useEffect(() => {
        const handler = (e) => {
          if (dropdownRef.current && !dropdownRef.current.contains(e.target))
            setIsDropdownOpen(false);
        };
        document.addEventListener('mousedown', handler);
        return () => document.removeEventListener('mousedown', handler);
      }, []);

      // ── FIREBASE AUTH ─────────────────────────────────────────────────────
      useEffect(() => {
        const unsubscribe = onAuthStateChanged(auth, async (user) => {
          if (user) {
            setFirebaseUser(user);
            setFbReady(true);
            setLoading(false);
          } else {
            try {
              if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
              } else {
                await signInAnonymously(auth);
              }
            } catch (err) {
              console.error('Firebase Auth error:', err.code, err.message);
              triggerActionNotice('Error de conexión con Firebase: ' + err.message, 'error');
              setLoading(false);
            }
          }
        });
        return () => unsubscribe();
      }, []);

      // ── FIRESTORE SUBSCRIPTIONS ───────────────────────────────────────────
      useEffect(() => {
        if (!fbReady || !firebaseUser) return;

        const logsRef  = collection(db, 'artifacts', appId, 'public', 'data', 'dailyLogs');
        const usersRef = collection(db, 'artifacts', appId, 'public', 'data', 'users');
        const phLogsRef = collection(db, 'artifacts', appId, 'public', 'data', 'powerHourLogs');

        const unsubLogs = onSnapshot(logsRef,
          (snap) => {
            const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            setAllLogs(list);
          },
          (err) => console.error('onSnapshot logs:', err.code, err.message)
        );

        const unsubUsers = onSnapshot(usersRef,
          (snap) => {
            const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            setFirestoreAgents(list);

            const saved = localStorage.getItem('bt120_agent_session');
            if (saved && !currentAgent) {
              try {
                const parsed = JSON.parse(saved);
                const merged = mergeAgents([...PRELOADED_AGENTS], list);
                const match  = merged.find(
                  a => a.email.toLowerCase() === parsed.email.toLowerCase() && a.pin === parsed.pin
                );
                if (match) {
                  setCurrentAgent(match);
                  setActiveTab(match.isAdmin ? 'admin' : 'daily');
                }
              } catch (_) { localStorage.removeItem('bt120_agent_session'); }
            }
          },
          (err) => console.error('onSnapshot users:', err.code, err.message)
        );

        const unsubPhLogs = onSnapshot(phLogsRef,
          (snap) => {
            const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            setPowerHourLogs(list);
          },
          (err) => console.error('onSnapshot phLogs:', err.code, err.message)
        );

        return () => { unsubLogs(); unsubUsers(); unsubPhLogs(); };
      }, [fbReady, firebaseUser]);

      const mergeAgents = (base, fromFirestore) => {
        const result = [...base];
        fromFirestore.forEach(fa => {
          const idx = result.findIndex(a => a.email.toLowerCase() === fa.email.toLowerCase());
          if (idx !== -1) result[idx] = { ...result[idx], ...fa };
          else result.push(fa);
        });
        return result;
      };

      const activeAgentsList = useMemo(
        () => mergeAgents([...PRELOADED_AGENTS], firestoreAgents),
        [firestoreAgents]
      );

      useEffect(() => {
        if (!currentAgent) return;
        const existing = allLogs.find(l => l.id === `${currentAgent.id}_${selectedDate}`);
        setDailyForm(existing ? {
          nuevosBD: existing.nuevosBD || 0,
          conversaciones: existing.conversaciones || 0,
          seguimiento: existing.seguimiento || 0,
          openHouse: existing.openHouse || 0,
          redesSociales: existing.redesSociales || 0,
          citas: existing.citas || 0,
          referencias: existing.referencias || 0,
          captaciones: existing.captaciones || 0,
          cierres: existing.cierres || 0,
        } : emptyForm());
      }, [selectedDate, allLogs, currentAgent]);

      const filteredSearchAgents = useMemo(() => {
        if (!agentSearchInput.trim()) return activeAgentsList;
        const t = agentSearchInput.toLowerCase();
        return activeAgentsList.filter(a =>
          a.nombre.toLowerCase().includes(t) || a.email.toLowerCase().includes(t)
        );
      }, [agentSearchInput, activeAgentsList]);

      // ── LOGIN ─────────────────────────────────────────────────────────────
      const handleAgentLogin = (e) => {
        e.preventDefault();
        setAuthError('');
        if (!selectedAgentTemp) { setAuthError('Selecciona un asesor de la lista.'); return; }
        if (selectedAgentTemp.pin !== pinInput.trim()) { setAuthError('PIN incorrecto.'); return; }
        setCurrentAgent(selectedAgentTemp);
        localStorage.setItem('bt120_agent_session', JSON.stringify({
          email: selectedAgentTemp.email, pin: selectedAgentTemp.pin
        }));
        setActiveTab(selectedAgentTemp.isAdmin ? 'admin' : 'daily');
        triggerActionNotice(`¡Bienvenido, ${selectedAgentTemp.nombre}!`, 'success');
        setPinInput(''); setSelectedAgentTemp(null); setAgentSearchInput('');
      };

      const handleLogout = () => {
        localStorage.removeItem('bt120_agent_session');
        setCurrentAgent(null); setActiveTab('daily');
        triggerActionNotice('Sesión cerrada', 'info');
      };

      // ── GUARDAR ACTIVIDAD DIARIA ──────────────────────────────────────────
      const handleSaveDailyLog = async (e) => {
        e.preventDefault();
        if (!currentAgent || !firebaseUser) {
          triggerActionNotice('Espera: conectando con Firebase...', 'error'); return;
        }
        setSavingLog(true);
        try {
          const logId = `${currentAgent.id}_${selectedDate}`;
          await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'dailyLogs', logId), {
            id: logId,
            userId: currentAgent.id,
            userName: currentAgent.nombre,
            userEmail: currentAgent.email,
            fecha: selectedDate,
            fechaActualizacion: new Date().toISOString(),
            ...dailyForm
          });
          triggerActionNotice(`¡Actividad del ${selectedDate} guardada!`, 'success');
        } catch (err) {
          console.error('Error guardando actividad:', err.code, err.message);
          triggerActionNotice(`Error al guardar: ${err.code || err.message}`, 'error');
        } finally { setSavingLog(false); }
      };

      // ── HORA DEL PODER LOGIC ──────────────────────────────────────────────
      const handlePowerHourAction = async (field) => {
        if (!currentAgent || !firebaseUser) {
          triggerActionNotice('Espera: conectando con Firebase...', 'error'); return;
        }
        try {
          const todayDate = new Date().toISOString().split('T')[0];
          const logId = `${currentAgent.id}_${todayDate}`;
          
          const currentLog = powerHourLogs.find(l => l.id === logId) || {
            id: logId, userId: currentAgent.id, userName: currentAgent.nombre, userEmail: currentAgent.email, fecha: todayDate,
            llamadas: 0, conversaciones: 0, nuevosBD: 0
          };

          await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'powerHourLogs', logId), {
            ...currentLog,
            [field]: (currentLog[field] || 0) + 1,
            fechaActualizacion: new Date().toISOString()
          }, { merge: true });
          
          triggerActionNotice(`+1 Registrado con éxito`, 'success');
        } catch (err) {
          console.error('Error guardando hora del poder:', err.code, err.message);
          triggerActionNotice(`Error al guardar: ${err.code || err.message}`, 'error');
        }
      };

      // ── IMPORTAR CSV ──────────────────────────────────────────────────────
      const handleCsvFileChange = (e) => {
        const file = e.target.files[0];
        setCsvError(''); setCsvPreviewData([]);
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const text    = ev.target.result;
            const delim   = text.split('\n')[0].includes(';') ? ';' : ',';
            const lines   = text.split(/\r?\n/);
            if (lines.length < 2) { setCsvError('Archivo CSV vacío.'); return; }

            const headers = lines[0].split(delim).map(h => h.trim().replace(/["']/g, '').toUpperCase());
            const required = ['NOMBRE_AGENTE', 'TELEFONO', 'PIN', 'EMAIL_KW', 'ROL'];
            const missing  = required.filter(f => !headers.includes(f));
            if (missing.length) { setCsvError(`Faltan columnas: ${missing.join(', ')}`); return; }

            const agents = [];
            for (let i = 1; i < lines.length; i++) {
              const line = lines[i].trim();
              if (!line) continue;
              const vals = []; let cur = ''; let inQ = false;
              for (const ch of line) {
                if (ch === '"' || ch === "'") { inQ = !inQ; }
                else if (ch === delim && !inQ) { vals.push(cur.trim()); cur = ''; }
                else cur += ch;
              }
              vals.push(cur.trim());
              if (vals.length < headers.length) continue;
              const row = {};
              headers.forEach((h, idx) => { row[h] = vals[idx]?.replace(/["']/g, '') || ''; });
              const email = row['EMAIL_KW']?.toLowerCase().trim();
              if (!email) continue;
              agents.push({
                id: email.replace(/[@.]/g, '_'),
                nombre: row['NOMBRE_AGENTE'],
                telefono: row['TELEFONO'],
                pin: row['PIN'],
                email,
                isAdmin: ['ADMIN', 'ADMINISTRADOR'].includes(row['ROL']?.toUpperCase())
              });
            }
            if (!agents.length) setCsvError('No se encontraron agentes válidos.');
            else setCsvPreviewData(agents);
          } catch (err) { setCsvError('Error al leer el CSV: ' + err.message); }
        };
        reader.readAsText(file);
      };

      const saveImportedAgents = async () => {
        if (!csvPreviewData.length) return;
        if (!firebaseUser) {
          triggerActionNotice('Firebase no está listo. Espera unos segundos y reintenta.', 'error');
          return;
        }
        setIsUploadingCsv(true);
        try {
          const batch = writeBatch(db);
          csvPreviewData.forEach(agent => {
            const ref = doc(db, 'artifacts', appId, 'public', 'data', 'users', agent.id);
            batch.set(ref, {
              id: agent.id,
              nombre: agent.nombre,
              telefono: agent.telefono || '',
              pin: agent.pin,
              email: agent.email,
              isAdmin: agent.isAdmin,
              fechaImportacion: new Date().toISOString()
            });
          });
          await batch.commit();
          triggerActionNotice(`¡${csvPreviewData.length} asesores importados correctamente!`, 'success');
          setCsvPreviewData([]);
          if (fileInputRef.current) fileInputRef.current.value = '';
        } catch (err) {
          console.error('Error importando agentes:', err.code, err.message);
          let msg = 'Error al guardar en Firebase.';
          if (err.code === 'permission-denied') {
            msg = '❌ Sin permisos. Ve a Firebase → Firestore → Reglas y aplica las reglas correctas.';
          } else if (err.code === 'unavailable') {
            msg = '❌ Firebase no disponible. Verifica tu conexión a internet.';
          } else if (err.code === 'not-found') {
            msg = '❌ Base de datos no existe. Crea Firestore en la consola de Firebase primero.';
          } else {
            msg = `❌ ${err.code}: ${err.message}`;
          }
          triggerActionNotice(msg, 'error');
        } finally { setIsUploadingCsv(false); }
      };

      // ── EXPORTAR CSV ──────────────────────────────────────────────────────
      const downloadCSV = (content, filename) => {
        const blob = new Blob(['\uFEFF' + content], { type: 'text/csv;charset=utf-8;' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
      };

      const downloadTemplateCSV = () => {
        downloadCSV(
          'NOMBRE_AGENTE,Telefono,pin,Email_KW,ROL\nLeopoldo Lascarro O.,+573107596589,9700,teckwsantaana@kwcolombia.com,ADMIN\nAndrés Felipe Gómez,3001234567,1234,andres.gomez@kwcolombia.com,AGENT',
          'Plantilla_Agentes_BT120.csv'
        );
      };

      const handleExportAgentsCSV = () => {
        const rows = activeAgentsList.map(a =>
          [`"${a.nombre}"`, `"${a.telefono||''}"`, `"${a.pin}"`, `"${a.email}"`, a.isAdmin ? 'ADMIN' : 'AGENT'].join(',')
        );
        downloadCSV('NOMBRE_AGENTE,Telefono,pin,Email_KW,ROL\n' + rows.join('\n'), 'Nomina_Actual_BT120.csv');
        triggerActionNotice('Nómina exportada', 'success');
      };

      const handleExportPerformanceCSV = () => {
        const header = 'Nombre,Email,Telefono,Puntos,Actividades,NuevosBD,Conversaciones,Seguimiento,OpenHouse,Redes,Citas,Referencias,Captaciones,Cierres';
        const rows = agentsPerformanceBase.map(a => {
          const ag = activeAgentsList.find(u => u.id === a.id);
          return [
            `"${a.nombre}"`, `"${a.email}"`, `"${ag?.telefono||''}"`,
            a.puntos, a.totalActividades,
            a.nuevosBD, a.conversaciones, a.seguimiento, a.openHouse, a.redesSociales, a.citas, a.referencias,
            a.captaciones, a.cierres
          ].join(',');
        });
        downloadCSV(header + '\n' + rows.join('\n'), `Consolidado_BT120_${new Date().toISOString().split('T')[0]}.csv`);
        triggerActionNotice('Consolidado exportado', 'success');
      };

      const handleExportDataCSV = () => {
        const header = 'Fecha,Agente,Email,Telefono,NuevosBD,Conversaciones,Seguimiento,OpenHouse,Redes,Citas,Referencias,Captaciones,Cierres,Puntos,Actividades,Simulado';
        const rows = allLogs.map(log => {
          const ag = activeAgentsList.find(u => u.id === log.userId);
          const sum = (log.nuevosBD||0)+(log.conversaciones||0)+(log.seguimiento||0)+(log.openHouse||0)+(log.redesSociales||0)+(log.citas||0)+(log.referencias||0)+(log.captaciones||0)+(log.cierres||0);
          return [
            log.fecha, `"${log.userName||''}"`, log.userEmail||'',
            `"${ag?.telefono||''}"`,
            log.nuevosBD||0, log.conversaciones||0, log.seguimiento||0,
            log.openHouse||0, log.redesSociales||0, log.citas||0, log.referencias||0,
            log.captaciones||0, log.cierres||0,
            calcScore(log), sum, log.esMock ? 'SI' : 'NO'
          ].join(',');
        });
        downloadCSV(header + '\n' + rows.join('\n'), `Reporte_Historico_BT120_${new Date().toISOString().split('T')[0]}.csv`);
        triggerActionNotice('Reporte histórico exportado', 'success');
      };

      // ── MOCK DATA ─────────────────────────────────────────────────────────
      const handleInsertMockData = async () => {
        if (!firebaseUser) { triggerActionNotice('Firebase no listo', 'error'); return; }
        setGeneratingMock(true);
        try {
          const today = new Date();
          const promises = [];
          activeAgentsList.filter(a => !a.isAdmin).forEach(agent => {
            for (let i = 0; i < 10; i++) {
              const d = new Date(); d.setDate(today.getDate() - i);
              const dateStr = d.toISOString().split('T')[0];
              const logId = `${agent.id}_${dateStr}`;
              promises.push(setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'dailyLogs', logId), {
                id: logId, userId: agent.id, userName: agent.nombre, userEmail: agent.email,
                fecha: dateStr, fechaActualizacion: new Date().toISOString(),
                nuevosBD: Math.floor(Math.random() * 4),
                conversaciones: Math.floor(Math.random() * 10) + 2,
                seguimiento: Math.floor(Math.random() * 6),

                            {isUploadingCsv ? <><RefreshCw className="w-3.5 h-3.5 animate-spin" />GUARDANDO...</> : <><CheckCircle2 className="w-3.5 h-3.5" />Confirmar y Aplicar</>}
                          </button>
                          {!firebaseUser && <p className="text-[10px] text-amber-600 font-bold text-center">Esperando conexión con Firebase...</p>}
                        </div>
                      )}
                    </div>

                    <div className="lg:col-span-2 border border-slate-200 rounded-2xl overflow-hidden bg-slate-50/30">
                      <div className="p-4 bg-white border-b border-slate-200 font-bold text-xs text-slate-700 flex justify-between items-center">
                        <span>Vista previa del CSV</span>
                        {csvPreviewData.length > 0 && <span className="text-[10px] bg-amber-100 text-amber-800 px-2.5 py-0.5 rounded-full font-bold">Listo para cargar</span>}
                      </div>
                      {csvPreviewData.length === 0 ? (
                        <div className="p-12 text-center text-slate-400 text-xs">Ningún archivo cargado aún.</div>
                      ) : (
                        <div className="max-h-56 overflow-y-auto overflow-x-auto text-xs">
                          <table className="w-full text-left border-collapse bg-white">
                            <thead className="bg-slate-100 font-bold text-slate-500 uppercase text-[9px] border-b border-slate-200">
                              <tr><th className="p-3">Nombre</th><th className="p-3">Email</th><th className="p-3 text-center">PIN</th><th className="p-3 text-center">Teléfono</th><th className="p-3 text-right">Rol</th></tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100 font-medium text-slate-700">
                              {csvPreviewData.map((a, i) => (
                                <tr key={i} className="hover:bg-slate-50">
                                  <td className="p-3 font-bold text-slate-900">{a.nombre}</td>
                                  <td className="p-3 font-normal text-slate-500">{a.email}</td>
                                  <td className="p-3 text-center font-mono font-bold text-rose-600">{a.pin}</td>
                                  <td className="p-3 text-center text-slate-500">{a.telefono||'N/A'}</td>
                                  <td className="p-3 text-right"><span className={`px-2 py-0.5 rounded-full text-[9px] font-bold ${a.isAdmin ? 'bg-rose-100 text-rose-700' : 'bg-slate-100 text-slate-600'}`}>{a.isAdmin ? 'ADMIN' : 'AGENT'}</span></td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      )}
                    </div>
                  </div>

                  <div className="p-4 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-600 space-y-2">
                    <div className="flex items-center gap-2 font-bold text-slate-800"><HelpCircle className="w-4 h-4 text-rose-600" />¿Cómo actualizar asesores?</div>
                    <p className="leading-relaxed">
                      1. Haz clic en <strong>Exportar Nómina</strong> para descargar la base actual.<br/>
                      2. Ábrela en Google Sheets → Archivo → Importar → Subir.<br/>
                      3. Edita nombres, teléfonos o PINs.<br/>
                      4. Descarga como CSV y súbela en el recuadro de arriba.
                    </p>
                  </div>
                </div>

                <div className="bg-gradient-to-r from-slate-950 via-indigo-950 to-slate-900 p-6 rounded-2xl text-white shadow-xl border border-indigo-500/20">
                  <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
                    <div className="space-y-1">
                      <div className="flex items-center gap-2">
                        <Award className="w-5 h-5 text-amber-300" />
                        <span className="bg-amber-400/20 text-amber-300 text-[9px] font-black px-2.5 py-0.5 rounded-full uppercase tracking-wider">Módulo de Tecnología</span>
                      </div>
                      <h3 className="text-lg font-black">Pruebas del Sistema BT120</h3>
                      <p className="text-indigo-200 text-xs font-light max-w-2xl leading-relaxed">Genera 10 días de datos simulados para verificar dashboards y reportes.</p>
                    </div>
                    <div className="flex flex-col sm:flex-row gap-3 w-full sm:w-auto">
                      <button onClick={handleInsertMockData} disabled={generatingMock}
                        className="flex-1 sm:flex-initial px-5 py-3 bg-amber-500 hover:bg-amber-600 text-slate-950 font-black rounded-xl text-xs tracking-wider flex items-center justify-center gap-2 shadow-lg disabled:opacity-50">
                        <RefreshCw className={`w-4 h-4 ${generatingMock ? 'animate-spin' : ''}`} />CARGAR SIMULACIÓN
                      </button>
                      <button onClick={confirmClearMockData} disabled={generatingMock}
                        className="flex-1 sm:flex-initial px-5 py-3 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl text-xs tracking-wider flex items-center justify-center gap-2 disabled:opacity-50">
                        BORRAR PRUEBAS
                      </button>
                    </div>
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                  {[
                    { label: 'Asesores Activos', value: adminGlobalMetrics.activeAgentsCount, icon: User, color: 'text-indigo-500' },
                    { label: 'Nuevos en Comando', value: adminGlobalMetrics.totalNuevosBD, icon: Database, color: 'text-rose-500', valueClass: 'text-rose-600' },
                    { label: 'Conversaciones', value: adminGlobalMetrics.totalConversaciones, icon: MessageCircle, color: 'text-sky-500' },
                    { label: 'Citas Agendadas', value: adminGlobalMetrics.totalCitas, icon: CalendarCheck, color: 'text-emerald-500' },
                  ].map(({ label, value, icon: Icon, color, valueClass }) => (
                    <div key={label} className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                      <div>
                        <span className="block text-[10px] font-bold text-slate-400 uppercase tracking-wider">{label}</span>
                        <span className={`text-xl font-black ${valueClass || 'text-slate-800'}`}>{value}</span>
                      </div>
                      <Icon className={`w-7 h-7 ${color}`} />
                    </div>
                  ))}
                </div>

                <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                  <div className="p-6 border-b border-slate-100 bg-slate-50/50 space-y-4">
                    <div className="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4">
                      <div>
                        <h3 className="text-md font-bold text-slate-850">Auditoría General de Datos</h3>
                        <p className="text-[10px] text-slate-400 mt-0.5">Sincronización en tiempo real</p>
                      </div>
                      <button onClick={handleExportDataCSV} className="w-full lg:w-auto px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl flex items-center justify-center gap-2 active:scale-95">
                        <Download className="w-4 h-4" />EXPORTAR CSV / EXCEL
                      </button>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
                      <div className="relative">
                        <Search className="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" />
                        <input type="text" placeholder="Buscar por asesor o fecha..." value={adminSearchTerm} onChange={(e) => setAdminSearchTerm(e.target.value)}
                          className="w-full pl-9 pr-4 py-2 bg-white border border-slate-200 rounded-lg text-xs font-semibold text-slate-700 focus:outline-none focus:ring-2 focus:ring-rose-500" />
                      </div>
                      <div className="relative">
                        <Filter className="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" />
                        <select value={adminSelectedUser} onChange={(e) => setAdminSelectedUser(e.target.value)}
                          className="w-full pl-9 pr-4 py-2 bg-white border border-slate-200 rounded-lg text-xs font-semibold text-slate-700 focus:outline-none focus:ring-2 focus:ring-rose-500 appearance-none cursor-pointer">
                          <option value="all">Todos los asesores</option>
                          {activeAgentsList.map(u => <option key={u.id} value={u.id}>{u.nombre}{u.isAdmin ? ' (Admin)' : ''}</option>)}
                        </select>
                      </div>
                    </div>
                  </div>

                  {filteredAdminLogs.length === 0 ? (
                    <div className="p-16 text-center text-slate-400">
                      <Database className="w-12 h-12 mx-auto mb-3 opacity-30" />
                      <p className="text-sm font-medium">No hay registros en este rango.</p>
                    </div>
                  ) : (
                    <div className="overflow-x-auto">
                      <table className="w-full text-left border-collapse">
                        <thead>
                          <tr className="bg-slate-50 text-[10px] font-bold text-slate-400 uppercase tracking-wider border-b border-slate-100">
                            {['Asesor','Fecha','Nuevos BD','Conversaciones','Seguimiento','Open House','Redes','Citas','Referencias','Captaciones','Cierres','Puntos'].map(h => (
                              <th key={h} className="py-3 px-2 sm:px-4 whitespace-nowrap">{h}</th>
                            ))}
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100 text-xs font-semibold text-slate-700">
                          {filteredAdminLogs.map(log => (
                            <tr key={log.id} className="hover:bg-slate-50/50">
                              <td className="py-3 px-2 sm:px-4 font-bold text-slate-900">
                                <div className="flex items-center gap-1.5">
                                  {log.userName}
                                  {log.esMock && <span className="bg-indigo-50 text-indigo-600 text-[8px] font-bold px-1.5 py-0.5 rounded border border-indigo-100 uppercase">Sim</span>}
                                </div>
                              </td>
                              <td className="py-3 px-2 sm:px-4 text-slate-500 font-normal whitespace-nowrap">{log.fecha}</td>
                              <td className="py-3 px-2 sm:px-4 text-center font-bold">{log.nuevosBD||0}</td>
                              <td className="py-3 px-2 sm:px-4 text-center text-emerald-600">{log.conversaciones||0}</td>
                              <td className="py-3 px-2 sm:px-4 text-center">{log.seguimiento||0}</td>
                              <td className="py-3 px-2 sm:px-4 text-center">{log.openHouse||0}</td>
                              <td className="py-3 px-2 sm:px-4 text-center">{log.redesSociales||0}</td>
                              <td className="py-3 px-2 sm:px-4 text-center text-purple-600">{log.citas||0}</td>
                              <td className="py-3 px-2 sm:px-4 text-center">{log.referencias||0}</td>
                              <td className="py-3 px-2 sm:px-4 text-center font-bold text-orange-600">{log.captaciones||0}</td>
                              <td className="py-3 px-2 sm:px-4 text-center font-bold text-green-600">{log.cierres||0}</td>
                              <td className="py-3 px-2 sm:px-4 text-right font-black text-rose-600 whitespace-nowrap">{calcScore(log)} Pts</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  )}
                </div>

              </div>
            )}
          </main>

          <footer className="bg-slate-950 text-slate-400 text-center py-6 border-t border-slate-900 text-[10px] mt-12 font-medium">
            <p>© 2026 Centro de negocios Inmobiliarios Santa Ana SAS. Todos los derechos reservados.</p>
            <p className="mt-1">Diseñado bajo los lineamientos tecnológicos de KW Santa Ana.</p>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
